services:
  caddy:
    image: caddy:2.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      RIFT_DOMAIN: ${RIFT_DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_RELAY_API_KEY: ${VITE_RELAY_API_KEY}
    restart: unless-stopped
    expose:
      - "80"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      APP_VERSION: "1.0.0"
      DATABASE_URL: postgresql+asyncpg://rift_user:${DB_PASSWORD}@postgres:5432/rift_db
      RIFT_ISSUER_PRIVATE_KEY_HEX: ${ISSUER_PRIVATE_KEY_HEX}
      ISSUER_KEY_VERSION: v1
      ADMIN_SECRET: ${ADMIN_SECRET}
      RELAY_API_KEY: ${RELAY_API_KEY}
      MOCK_STARTING_BALANCE_KOBO: "5000000"
      CORS_ORIGINS: https://${RIFT_DOMAIN}
      AUTO_CREATE_SCHEMA: "false"
      RUN_MIGRATIONS: "true"
      PORT: "8000"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rift_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: rift_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rift_user -d rift_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
